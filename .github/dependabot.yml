version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/hksc-electron"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels: ["dependabot", "security"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
